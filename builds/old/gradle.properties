org.gradle.jvmargs=-Xmx4G -Dfile.encoding=UTF-8
org.gradle.daemon=false
# Both Forge targets call ForgeGradle's dependency remapper.  In a clean,
# multi-project build its installertools download/cache can race across projects,
# leaving ConsoleTool absent from a simultaneously resolved tool JAR.  Serialize
# the legacy projects; modern NeoForge generations retain parallel builds.
org.gradle.parallel=false
org.gradle.caching=true

enable_ic2_runtime=false
ci_runtime_profile=default
