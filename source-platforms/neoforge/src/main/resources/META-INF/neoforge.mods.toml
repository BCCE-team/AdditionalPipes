modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
showAsResourcePack=false

[[mods]]
modId="additionalpipes"
version="${mod_version}"
displayName="Additional Pipes for BuildCraft Community Edition"
authors="Additional Pipes Contributors, BCCE community"
description='''
Additional Pipes integration for BuildCraft Community Edition (infrastructure-only build).
    '''

[[dependencies.additionalpipes]]
modId="neoforge"
type="required"
versionRange="${neo_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.additionalpipes]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.additionalpipes]]
modId="buildcraftlib"
type="required"
versionRange="${buildcraft_version_range}"
ordering="AFTER"
side="BOTH"

[[dependencies.additionalpipes]]
modId="buildcrafttransport"
type="required"
versionRange="${buildcraft_version_range}"
ordering="AFTER"
side="BOTH"
